<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House Pedidos</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  font-size: 34px;
  margin-bottom: 8px;
}

header p {
  font-size: 15px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px 15px 100px;
}

h2 {
  margin: 20px 0 15px;
}

.categorias {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  margin-bottom: 20px;
}

.categoria {
  min-width: 120px;
  padding: 15px 10px;
  border: none;
  border-radius: 12px;
  background: white;
  font-weight: bold;
  cursor: pointer;
}

.produto {
  background: white;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.produto h3 {
  margin-bottom: 7px;
}

.produto p {
  color: #666;
  font-size: 14px;
  margin-bottom: 12px;
}

.preco {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

button.adicionar {
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
}

.carrinho {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-top: 25px;
}

.item-carrinho {
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
}

.total {
  font-size: 21px;
  font-weight: bold;
  margin-top: 15px;
}

.finalizar {
  width: 100%;
  border: none;
  background: #25D366;
  color: white;
  padding: 16px;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 17px;
  font-weight: bold;
}

.formulario {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-top: 25px;
}

.formulario input,
.formulario select,
.formulario textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.enviar {
  width: 100%;
  background: #25D366;
  color: white;
  border: none;
  padding: 16px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <h1>HOUSE</h1>
  <p>Faça seu pedido de forma rápida e fácil</p>
</header>

<div class="container">

  <h2>Escolha uma categoria</h2>

  <div class="categorias">
    <button class="categoria" onclick="mostrar('pasteis')">
      🥟 Pastéis
    </button>

    <button class="categoria" onclick="mostrar('acai')">
      🍧 Açaí
    </button>

    <button class="categoria" onclick="mostrar('bebidas')">
      🍺 Bebidas
    </button>
  </div>

  <div id="produtos"></div>

  <div class="carrinho">

    <h2>🛒 Seu pedido</h2>

    <div id="carrinho">
      <p>Nenhum produto adicionado.</p>
    </div>

    <div class="total">
      Total: R$ <span id="total">0,00</span>
    </div>

    <button class="finalizar" onclick="abrirFormulario()">
      📲 Finalizar pedido
    </button>

  </div>

  <div class="formulario" id="formulario" style="display:none;">

    <h2>📝 Seus dados</h2>

    <label>Nome</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
    >

    <label>Tipo do pedido</label>

    <select id="tipoPedido" onchange="mostrarEndereco()">
      <option value="retirada">Retirar no estabelecimento</option>
      <option value="entrega">Entrega</option>
    </select>

    <div id="campoEndereco" style="display:none;">

      <label>Endereço</label>

      <textarea
        id="endereco"
        rows="3"
        placeholder="Rua, número, bairro e complemento"
      ></textarea>

    </div>

    <label>Forma de pagamento</label>

    <select id="pagamento">
      <option value="Pix">Pix</option>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Cartão">Cartão</option>
    </select>

    <button class="enviar" onclick="enviarWhatsApp()">
      📲 Enviar pedido pelo WhatsApp
    </button>

  </div>

</div>

<script>

/* =================================================
   NÚMERO DO WHATSAPP DA HOUSE
   Para trocar futuramente, altere somente este número.
   ================================================= */

const WHATSAPP = "5562981339087";


let carrinho = [];
let total = 0;


const produtos = {

pasteis: [

  {
    nome: "Pastel de Carne",
    preco: 13
  },

  {
    nome: "Pastel de Carne com Queijo",
    preco: 13
  },

  {
    nome: "Pastel de Queijo",
    preco: 13
  },

  {
    nome: "Pastel de Presunto e Queijo",
    preco: 13
  },

  {
    nome: "Pastel de Frango com Queijo",
    preco: 13
  },

  {
    nome: "Pastel de Calabresa com Queijo",
    preco: 13
  },

  {
    nome: "Pastel de Pizza",
    preco: 13
  },

  {
    nome: "Pastel Especial de Carne, Queijo, Milho e Bacon",
    preco: 16
  },

  {
    nome: "Pastel Especial de Frango, Queijo, Milho e Catupiry",
    preco: 16
  },

  {
    nome: "Pastel Especial de Calabresa, Queijo, Cebola e Bacon",
    preco: 16
  },

  {
    nome: "Pastel Especial de Frango com Catupiry e Bacon",
    preco: 16
  }

],

acai: [

  {
    nome: "House Açaí Clássico 300 ml",
    preco: 0
  },

  {
    nome: "House Açaí Clássico 500 ml",
    preco: 0
  },

  {
    nome: "House Açaí Clássico 700 ml",
    preco: 0
  },

  {
    nome: "House Açaí com Creme de Ninho 300 ml",
    preco: 0
  },

  {
    nome: "House Açaí com Creme de Ninho 500 ml",
    preco: 0
  },

  {
    nome: "House Açaí com Creme de Ninho 700 ml",
    preco: 0
  }

],

bebidas: [

  {
    nome: "Coca-Cola 1,5 L",
    preco: 0
  },

  {
    nome: "Coca-Cola 2 L",
    preco: 0
  },

  {
    nome: "Guaraná 1,5 L",
    preco: 0
  },

  {
    nome: "Guaraná 2 L",
    preco: 0
  },

  {
    nome: "Heineken",
    preco: 0
  },

  {
    nome: "Amstel",
    preco: 0
  },

  {
    nome: "Brahma 269 ml",
    preco: 0
  },

  {
    nome: "Brahma 350 ml",
    preco: 0
  },

  {
    nome: "Bavária",
    preco: 0
  },

  {
    nome: "Sol",
    preco: 0
  },

  {
    nome: "Antarctica Original 269 ml",
    preco: 0
  },

  {
    nome: "Antarctica Original 350 ml",
    preco: 0
  },

  {
    nome: "Suco de Laranja Natural",
    preco: 0
  }

]

};


function mostrar(categoria) {

  const area = document.getElementById("produtos");

  area.innerHTML = "";

  produtos[categoria].forEach((produto) => {

    let precoTexto =
      produto.preco > 0
      ? "R$ " + produto.preco.toFixed(2).replace(".", ",")
      : "Preço a definir";

    area.innerHTML += `

      <div class="produto">

        <h3>${produto.nome}</h3>

        <p>Escolha este produto para adicionar ao pedido.</p>

        <div class="preco">
          ${precoTexto}
        </div>

        <button
          class="adicionar"
          onclick="adicionar('${produto.nome}', ${produto.preco})">

          + Adicionar ao pedido

        </button>

      </div>

    `;

  });

}


function adicionar(nome, preco) {

  carrinho.push({
    nome: nome,
    preco: preco
  });

  atualizarCarrinho();

}


function atualizarCarrinho() {

  const area = document.getElementById("carrinho");

  area.innerHTML = "";

  total = 0;

  carrinho.forEach((item) => {

    total += item.preco;

    area.innerHTML += `

      <div class="item-carrinho">

        <strong>${item.nome}</strong>

        <br>

        R$ ${item.preco.toFixed(2).replace(".", ",")}

      </div>

    `;

  });

  if (carrinho.length === 0) {

    area.innerHTML =
      "<p>Nenhum produto adicionado.</p>";

  }

  document.getElementById("total").innerText =
    total.toFixed(2).replace(".", ",");

}


function abrirFormulario() {

  if (carrinho.length === 0) {

    alert("Adicione algum produto ao pedido.");

    return;
  }

  document.getElementById("formulario").style.display = "block";

  document.getElementById("formulario")
    .scrollIntoView({
      behavior: "smooth"
    });

}


function mostrarEndereco() {

  const tipo =
    document.getElementById("tipoPedido").value;

  const campo =
    document.getElementById("campoEndereco");

  if (tipo === "entrega") {

    campo.style.display = "block";

  } else {

    campo.style.display = "none";

  }

}


function enviarWhatsApp() {

  const nome =
    document.getElementById("nome").value.trim();

  const tipo =
    document.getElementById("tipoPedido").value;

  const pagamento =
    document.getElementById("pagamento").value;

  const endereco =
    document.getElementById("endereco").value.trim();


  if (!nome) {

    alert("Digite seu nome.");

    return;

  }


  if (tipo === "entrega" && !endereco) {

    alert("Digite o endereço para entrega.");

    return;

  }


  let mensagem =
    "🏠 *NOVO PEDIDO - HOUSE*%0A%0A";

  mensagem +=
    "👤 *Cliente:* " + nome + "%0A";


  if (tipo === "entrega") {

    mensagem +=
      "🚚 *Entrega*%0A";

    mensagem +=
      "📍 *Endereço:* " + endereco + "%0A";

  } else {

    mensagem +=
      "🏪 *Retirada no estabelecimento*%0A";

  }


  mensagem +=
    "💳 *Pagamento:* " + pagamento + "%0A%0A";


  mensagem +=
    "🛒 *ITENS DO PEDIDO:*%0A";


  carrinho.forEach((item, index) => {

    mensagem +=
      (index + 1) +
      ". " +
      item.nome +
      " - R$ " +
      item.preco.toFixed(2).replace(".", ",") +
      "%0A";

  });


  mensagem +=
    "%0A💰 *TOTAL: R$ " +
    total.toFixed(2).replace(".", ",") +
    "*";


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    mensagem;


  window.open(url, "_blank");

}


mostrar("pasteis");

</script>

</body>
</html>
